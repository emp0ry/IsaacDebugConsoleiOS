name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: console-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-release:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install packaging tools
        shell: bash
        run: |
          set -euo pipefail
          command -v dpkg-deb >/dev/null 2>&1 || brew install dpkg
          command -v rg >/dev/null 2>&1 || brew install ripgrep

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk '/^Version:/ { print $2 }' package/control)"
          test -n "$version"
          test -f "docs/RELEASE_NOTES_v${version}.md"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test "$GITHUB_REF_NAME" = "v${version}" || {
              echo "Tag $GITHUB_REF_NAME does not match package version v${version}" >&2
              exit 1
            }
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build and verify every distribution
        shell: bash
        run: |
          set -euo pipefail
          make release EXTRA_CFLAGS='-Wall -Wextra -Werror'

      - name: Verify release contents
        shell: bash
        run: |
          set -euo pipefail
          required=(
            dist/IsaacDebugConsole.dylib
            dist/IsaacDebugConsole-rootless.deb
            dist/IsaacDebugConsole-LiveContainer.framework.zip
            dist/IsaacDebugConsole-Embedded.zip
            dist/IsaacDebugConsole-Full-Build.zip
            dist/SHA256SUMS
          )
          for file in "${required[@]}"; do test -s "$file"; done
          unzip -l dist/IsaacDebugConsole-LiveContainer.framework.zip | grep -q 'IsaacDebugConsole.framework/IsaacDebugConsole'
          unzip -l dist/IsaacDebugConsole-Embedded.zip | grep -q 'IsaacDebugConsole.dylib'
          dpkg-deb -c dist/IsaacDebugConsole-rootless.deb | grep -q 'IsaacDebugConsole.dylib'

      - name: Upload verified build
        uses: actions/upload-artifact@v6
        with:
          name: IsaacDebugConsole-v${{ steps.version.outputs.version }}
          path: |
            dist/IsaacDebugConsole.dylib
            dist/IsaacDebugConsole-rootless.deb
            dist/IsaacDebugConsole-LiveContainer.framework.zip
            dist/IsaacDebugConsole-Embedded.zip
            dist/IsaacDebugConsole-Full-Build.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "v${VERSION}" \
            --verify-tag \
            --target "$GITHUB_SHA" \
            --title "Isaac Debug Console iOS v${VERSION}" \
            --notes-file "docs/RELEASE_NOTES_v${VERSION}.md" \
            --latest \
            dist/IsaacDebugConsole.dylib \
            dist/IsaacDebugConsole-rootless.deb \
            dist/IsaacDebugConsole-LiveContainer.framework.zip \
            dist/IsaacDebugConsole-Embedded.zip \
            dist/IsaacDebugConsole-Full-Build.zip \
            dist/SHA256SUMS
